services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage:z

  clip-vision:
    build: .
    command: python clip_vision_api.py
    ports:
      - "8001:8001"

  upload-api:
    build: .
    command: python upload_api.py
    ports:
      - "8004:8004"
    env_file: .env
    depends_on:
      - qdrant
      - clip-vision
