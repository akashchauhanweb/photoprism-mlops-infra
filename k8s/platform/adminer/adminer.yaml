apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminer
  namespace: photoprism-platform
  labels: { app: adminer }
spec:
  replicas: 1
  selector: { matchLabels: { app: adminer } }
  template:
    metadata:
      labels: { app: adminer }
    spec:
      containers:
        - name: adminer
          image: adminer:4.8.1
          ports: [{ containerPort: 8080 }]
          env:
            - name: ADMINER_DEFAULT_SERVER
              value: postgres.photoprism-platform.svc.cluster.local
            - name: ADMINER_DESIGN
              value: pepa-linha
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: adminer
  namespace: photoprism-platform
spec:
  type: NodePort
  selector: { app: adminer }
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30801
