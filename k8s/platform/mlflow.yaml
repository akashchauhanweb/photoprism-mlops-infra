apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: photoprism-platform
spec:
  replicas: 1
  selector:
    matchLabels: { app: mlflow }
  template:
    metadata:
      labels: { app: mlflow }
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v3.9.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              pip install --no-cache-dir psycopg2-binary boto3 >/dev/null
              exec mlflow server \
                --host 0.0.0.0 --port 5000 \
                --allowed-hosts "*" \
                --cors-allowed-origins "*" \
                --backend-store-uri "postgresql://$PG_USER:$PG_PASS@postgres:5432/mlflow" \
                --default-artifact-root "s3://$S3_BUCKET/mlflow/"
          env:
            - { name: PG_USER, valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_USER } } }
            - { name: PG_PASS, valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_PASSWORD } } }
            - { name: S3_BUCKET,           valueFrom: { secretKeyRef: { name: objectstore-credentials, key: S3_BUCKET } } }
            - { name: MLFLOW_S3_ENDPOINT_URL, valueFrom: { secretKeyRef: { name: objectstore-credentials, key: S3_ENDPOINT } } }
            - { name: AWS_ACCESS_KEY_ID,   valueFrom: { secretKeyRef: { name: objectstore-credentials, key: S3_ACCESS_KEY } } }
            - { name: AWS_SECRET_ACCESS_KEY, valueFrom: { secretKeyRef: { name: objectstore-credentials, key: S3_SECRET_KEY } } }
            - { name: AWS_DEFAULT_REGION,  valueFrom: { secretKeyRef: { name: objectstore-credentials, key: S3_REGION } } }
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 30
            periodSeconds: 5
          resources:
            requests: { cpu: "100m", memory: "512Mi" }
            limits:   { cpu: "1",    memory: "2Gi"  }
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: photoprism-platform
spec:
  type: NodePort
  selector: { app: mlflow }
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500
