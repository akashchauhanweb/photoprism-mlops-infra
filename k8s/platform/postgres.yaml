apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: photoprism-platform
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: photoprism-platform
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        envFrom:
        - secretRef: { name: postgres-credentials }
        volumeMounts:
        - { name: data, mountPath: /var/lib/postgresql/data, subPath: pgdata }
        - { name: init, mountPath: /docker-entrypoint-initdb.d }
        readinessProbe:
          exec: { command: [pg_isready, -U, photoprism] }
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests: { cpu: 200m, memory: 512Mi }
          limits:   { cpu: "1",  memory: 2Gi }
      volumes:
      - name: data
        persistentVolumeClaim: { claimName: postgres-pvc }
      - name: init
        configMap: { name: postgres-init }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: photoprism-platform
spec:
  selector: { app: postgres }
  ports:
  - { port: 5432, targetPort: 5432 }
