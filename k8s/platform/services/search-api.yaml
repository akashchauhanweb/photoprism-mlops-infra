apiVersion: v1
kind: Service
metadata:
  name: search-api
  namespace: photoprism-platform
spec:
  type: NodePort
  selector: { app: search-api }
  ports:
  - { port: 8010, targetPort: 8010, nodePort: 30810 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-api
  namespace: photoprism-platform
spec:
  replicas: 1
  selector:
    matchLabels: { app: search-api }
  template:
    metadata:
      labels: { app: search-api }
    spec:
      containers:
      - name: search-api
        image: akashweb/search-api:0.3.3
        ports: [{ containerPort: 8010 }]
        envFrom:
        - secretRef: { name: search-api-secrets }
        - secretRef: { name: internal-token }
        - secretRef: { name: objectstore-credentials }
        env:
        - { name: RERANKER_ENABLED,  value: "true" }
        - { name: RETRAIN_THRESHOLD, value: "10" }
        readinessProbe:
          httpGet: { path: /ready, port: 8010 }
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet: { path: /health, port: 8010 }
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests: { cpu: 100m, memory: 256Mi }
          limits:   { cpu: 500m, memory: 512Mi }
