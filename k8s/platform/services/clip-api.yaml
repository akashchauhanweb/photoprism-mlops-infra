apiVersion: v1
kind: Service
metadata:
  name: clip-api
  namespace: photoprism-platform
spec:
  selector: { app: clip-api }
  ports:
  - { port: 8001, targetPort: 8001 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clip-api
  namespace: photoprism-platform
spec:
  replicas: 1
  selector:
    matchLabels: { app: clip-api }
  template:
    metadata:
      labels: { app: clip-api }
    spec:
      containers:
      - name: clip-api
        image: akashweb/clip-api:0.1.1
        ports: [{ containerPort: 8001 }]
        envFrom:
        - secretRef: { name: internal-token }
        readinessProbe:
          httpGet: { path: /ready, port: 8001 }
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet: { path: /health, port: 8001 }
          initialDelaySeconds: 30
          periodSeconds: 30
        resources:
          requests: { cpu: 500m, memory: 1Gi }
          limits:   { cpu: "2",  memory: 3Gi }
