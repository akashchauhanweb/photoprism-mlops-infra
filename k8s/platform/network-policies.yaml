# Deny all ingress by default in both namespaces
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: photoprism-platform
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: photoprism-production
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# Allow DNS egress from every pod in both namespaces (CoreDNS is in kube-system)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: photoprism-platform
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector:
        matchLabels: { kubernetes.io/metadata.name: kube-system }
    ports:
    - { protocol: UDP, port: 53 }
    - { protocol: TCP, port: 53 }
  - {}  # allow all other egress (S3, HuggingFace, PhotoPrism)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: photoprism-production
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector:
        matchLabels: { kubernetes.io/metadata.name: kube-system }
    ports:
    - { protocol: UDP, port: 53 }
    - { protocol: TCP, port: 53 }
  - {}
---
# PLATFORM namespace — per-service ingress rules
---
# postgres: platform services + production (none use it from prod, but keep door open for future)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres
  namespace: photoprism-platform
spec:
  podSelector:
    matchLabels: { app: postgres }
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels: { kubernetes.io/metadata.name: photoprism-platform }
    ports: [{ protocol: TCP, port: 5432 }]
  # Allow NodePort 30532 from anywhere (feedback-trainer on GPU VM, external debugging)
  - ports: [{ protocol: TCP, port: 5432 }]
---
# qdrant: platform services only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-qdrant
  namespace: photoprism-platform
spec:
  podSelector:
    matchLabels: { app: qdrant }
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels: { kubernetes.io/metadata.name: photoprism-platform }
    ports:
    - { protocol: TCP, port: 6333 }
    - { protocol: TCP, port: 6334 }
  # Allow NodePort 30633 from anywhere (kubelet health checks + external debugging)
  - ports: [{ protocol: TCP, port: 6333 }]
---
# clip-api: only from feature-worker, search-api (both in platform ns)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-clip-api
  namespace: photoprism-platform
spec:
  podSelector:
    matchLabels: { app: clip-api }
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector: { matchLabels: { app: feature-worker } }
    - podSelector: { matchLabels: { app: search-api } }
    ports: [{ protocol: TCP, port: 8001 }]
---
# ingest-api: from photoprism (production) + NodePort health
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingest-api
  namespace: photoprism-platform
spec:
  podSelector:
    matchLabels: { app: ingest-api }
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels: { kubernetes.io/metadata.name: photoprism-production }
    ports: [{ protocol: TCP, port: 8004 }]
  # Kubelet health probes
  - ports: [{ protocol: TCP, port: 8004 }]
---
# search-api: NodePort exposed (from anywhere) + internal probes
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-search-api
  namespace: photoprism-platform
spec:
  podSelector:
    matchLabels: { app: search-api }
  policyTypes: [Ingress]
  ingress:
  - ports: [{ protocol: TCP, port: 8010 }]
---
# PRODUCTION namespace
---
# photoprism: public via NodePort; also callable from ingest-api (for /photos/:uid/dl)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-photoprism
  namespace: photoprism-production
spec:
  podSelector:
    matchLabels: { app: photoprism }
  policyTypes: [Ingress]
  ingress:
  - ports: [{ protocol: TCP, port: 2342 }]
---
# mariadb: only from photoprism in same ns
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mariadb
  namespace: photoprism-production
spec:
  podSelector:
    matchLabels: { app: mariadb }
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector: { matchLabels: { app: photoprism } }
    ports: [{ protocol: TCP, port: 3306 }]
---
# mlflow: platform services + NodePort 30500 from anywhere
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mlflow
  namespace: photoprism-platform
spec:
  podSelector:
    matchLabels: { app: mlflow }
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels: { kubernetes.io/metadata.name: photoprism-platform }
    ports: [{ protocol: TCP, port: 5000 }]
  # Allow NodePort 30500 from anywhere (feedback-trainer on GPU VM + browser UI)
  - ports: [{ protocol: TCP, port: 5000 }]
