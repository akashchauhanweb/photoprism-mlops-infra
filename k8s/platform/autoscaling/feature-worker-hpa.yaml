apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: feature-worker
  namespace: photoprism-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: feature-worker
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: External
      external:
        metric:
          name: feature_worker_queue_pending
          selector:
            matchLabels:
              namespace: photoprism-platform
        target:
          type: AverageValue
          averageValue: "5"   # scale up when avg pending > 5 per pod
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
