apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: clip-api
  namespace: photoprism-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: clip-api
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 75 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600  # CLIP holds model in RAM; don't churn
    scaleUp:
      stabilizationWindowSeconds: 60
