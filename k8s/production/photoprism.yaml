---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: photoprism-originals-pvc
  namespace: photoprism-production
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: photoprism-storage-pvc
  namespace: photoprism-production
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: photoprism
  namespace: photoprism-production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: photoprism
  template:
    metadata:
      labels:
        app: photoprism
    spec:
      containers:
        - name: photoprism
          image: photoprism/photoprism:latest
          ports:
            - containerPort: 2342
          env:
            - name: PHOTOPRISM_ADMIN_USER
              value: "admin"
            - name: PHOTOPRISM_ADMIN_PASSWORD
              value: "photoprism-admin"
            - name: PHOTOPRISM_SITE_URL
              value: "http://localhost:2342/"
            - name: PHOTOPRISM_DATABASE_DRIVER
              value: "mysql"
            - name: PHOTOPRISM_DATABASE_SERVER
              value: "mariadb:3306"
            - name: PHOTOPRISM_DATABASE_NAME
              value: "photoprism"
            - name: PHOTOPRISM_DATABASE_USER
              value: "photoprism"
            - name: PHOTOPRISM_DATABASE_PASSWORD
              value: "photoprism-db-pass"
            - name: PHOTOPRISM_DISABLE_TENSORFLOW
              value: "true"
          volumeMounts:
            - name: originals
              mountPath: /photoprism/originals
            - name: storage
              mountPath: /photoprism/storage
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
      volumes:
        - name: originals
          persistentVolumeClaim:
            claimName: photoprism-originals-pvc
        - name: storage
          persistentVolumeClaim:
            claimName: photoprism-storage-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: photoprism
  namespace: photoprism-production
spec:
  type: NodePort
  selector:
    app: photoprism
  ports:
    - port: 2342
      targetPort: 2342
      nodePort: 30234
